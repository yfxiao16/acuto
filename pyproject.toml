[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acuto"
version = "0.1.0"
description = "A symbolic control layer for LLM agents: contracts over tool calls, compiled to automata that mask, route and verify every step"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yifeng Xiao" }]
requires-python = ">=3.10"
keywords = [
    "llm-agents",
    "runtime-enforcement",
    "assume-guarantee-contracts",
    "ltlf",
    "tool-use",
    "neuro-symbolic",
    "symbolic-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The framework depends only on ContrAgent (the contract kernel) and the
# standard library. It imports from ContrAgent's public modules only:
# ``contragent``, ``contragent.formulas`` and ``contragent.kernel`` (new in
# 1.2, stable within a major version); tests/test_kernel_boundary.py checks it.
dependencies = ["contragent>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/yfxiao16/acuto"
Repository = "https://github.com/yfxiao16/acuto"
Issues = "https://github.com/yfxiao16/acuto/issues"
Changelog = "https://github.com/yfxiao16/acuto/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.16", "pyyaml"]

[tool.setuptools.packages.find]
include = ["acuto*"]

[tool.setuptools.package-data]
acuto = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".contragent"]
